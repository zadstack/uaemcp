<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="t d"><title id="t">Architecture</title><desc id="d">Official sources flow through typed connectors into the Bun engine, which exposes MCP, REST, vector tiles and SDKs, delivered by the Cloudflare Worker, the Maarad static canvas, npm and a container image.</desc><style>
