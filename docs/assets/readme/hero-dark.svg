<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="t d"><title id="t">Open Emirates Intelligence</title><desc id="d">The Emirates, queryable. Official UAE open data over MCP, REST, vector tiles and six SDKs.</desc><style>
text{font-family:Dubai,'Segoe UI','Noto Sans','Noto Sans Arabic',Arial,sans-serif}.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}.ar{direction:rtl;unicode-bidi:embed}
.row{opacity:1}.scan{opacity:0}
@media (prefers-reduced-motion:no-preference){@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.row{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateY(262px);opacity:0}}
.scan{animation:scan 5.5s cubic-bezier(.45,0,.55,1) 1.4s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-origin:72px 0;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) .2s both}}
</style><rect width="1400" height="460" fill="#0f1d17"/>
