<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Quick start</title><desc id="d">Run uaemcp with bunx, or call the hosted Worker's /health and /api/v1/places endpoints with curl.</desc><style>text{font-family:Dubai,'Segoe UI','Noto Sans','Noto Sans Arabic',Arial,sans-serif}.mt{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}.cv{transform:translateX(1200px)}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.cv{transform:none}@keyframes k0{0%{transform:translateX(0);animation-timing-function:step-end}2.50%{transform:translateX(0);animation-timing-function:steps(1,end)}4.06%,94%{transform:translateX(677px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c0{animation:k0 16s infinite}
@keyframes k1{0%{transform:translateX(0);animation-timing-function:step-end}5.31%{transform:translateX(0);animation-timing-function:steps(33,end)}14.59%,94%{transform:translateX(361px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c1{animation:k1 16s infinite}
@keyframes k2{0%{transform:translateX(0);animation-timing-function:step-end}16.78%{transform:translateX(0);animation-timing-function:steps(31,end)}25.50%,94%{transform:translateX(340px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c2{animation:k2 16s infinite}
@keyframes k3{0%{transform:translateX(0);animation-timing-function:step-end}27.69%{transform:translateX(0);animation-timing-function:steps(1,end)}29.25%,94%{transform:translateX(401px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c3{animation:k3 16s infinite}
@keyframes k4{0%{transform:translateX(0);animation-timing-function:step-end}30.50%{transform:translateX(0);animation-timing-function:steps(51,end)}44.25%,94%{transform:translateX(544px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c4{animation:k4 16s infinite}
@keyframes k5{0%{transform:translateX(0);animation-timing-function:step-end}46.44%{transform:translateX(0);animation-timing-function:steps(1,end)}48.00%,94%{transform:translateX(646px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c5{animation:k5 16s infinite}
@keyframes k6{0%{transform:translateX(0);animation-timing-function:step-end}49.25%{transform:translateX(0);animation-timing-function:steps(76,end)}63.00%,94%{transform:translateX(799px);animation-timing-function:step-end}100%{transform:translateX(0)}}.c6{animation:k6 16s infinite}.cur{animation:blink 1s steps(1) infinite}}</style><rect width="1200" height="370" fill="#13251d"/><rect width="1200" height="44" fill="#173d2d"/><rect x="20" y="16" width="12" height="12" fill="#c34032"/><rect x="40" y="16" width="12" height="12" fill="#bf9a55"/><rect x="60" y="16" width="12" height="12" fill="#087443"/><text x="600" y="27" text-anchor="middle" class="m" font-size="13" fill="#f1eddf" opacity=".8">QUICK START · BASH</text><path d="M0 44H1200" stroke="#f1eddf" opacity=".15"/>
<text x="40" y="104" class="mt" font-size="17" fill="#a9b5ad" xml:space="preserve"># run the MCP server locally (stdio, or Streamable HTTP at /mcp)</text><rect class="cv c0" x="36" y="87" width="677" height="27" fill="#13251d"/><text x="40" y="138" class="mt" font-size="17" fill="#f1eddf" xml:space="preserve"><tspan fill="#bf9a55">$ </tspan>bunx --bun uaemcp@latest doctor</text><rect class="cv c1" x="36" y="121" width="361" height="27" fill="#13251d"/><text x="40" y="172" class="mt" font-size="17" fill="#f1eddf" xml:space="preserve"><tspan fill="#bf9a55">$ </tspan>bunx --bun uaemcp@latest http</text><rect class="cv c2" x="36" y="155" width="340" height="27" fill="#13251d"/><text x="40" y="206" class="mt" font-size="17" fill="#a9b5ad" xml:space="preserve"># or query the hosted Worker directly</text><rect class="cv c3" x="36" y="189" width="401" height="27" fill="#13251d"/><text x="40" y="240" class="mt" font-size="17" fill="#f1eddf" xml:space="preserve"><tspan fill="#bf9a55">$ </tspan>curl -s https://uae-open-data.zadstack.com/health</text><rect class="cv c4" x="36" y="223" width="544" height="27" fill="#13251d"/><text x="40" y="274" class="mt" font-size="17" fill="#3fae7a" xml:space="preserve">{&quot;ok&quot;:true,&quot;status&quot;:&quot;alive&quot;,&quot;runtime&quot;:&quot;cloudflare-workers&quot;,…}</text><rect class="cv c5" x="36" y="257" width="646" height="27" fill="#13251d"/><text x="40" y="308" class="mt" font-size="17" fill="#f1eddf" xml:space="preserve"><tspan fill="#bf9a55">$ </tspan>curl -s 'https://uae-open-data.zadstack.com/api/v1/places?q=Dubai&amp;limit=5'</text><rect class="cv c6" x="36" y="291" width="799" height="27" fill="#13251d"/><text x="40" y="342" class="mt" font-size="17" fill="#bf9a55">$</text><rect class="cur" x="60" y="327" width="10" height="17" fill="#c34032"/><rect x=".5" y=".5" width="1199" height="369" fill="none" stroke="#13251d" opacity=".4"/></svg>
