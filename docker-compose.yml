# Actual hosted deployment: the app runs as this container, and CloudPanel's
# nginx reverse-proxies https://uaemcp.zad.tools → 127.0.0.1:8088.
# Redeploy on the server:  git pull && docker compose up -d --build
services:
  uaemcp:
    build: .
    image: uaemcp:latest
    container_name: uaemcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      # Behind a reverse proxy the app sees the public Host header, so it must be
      # allow-listed or the /mcp endpoint returns 421 (DNS-rebinding protection).
      UAEMCP_ALLOWED_HOSTS: "uaemcp.zad.tools,uae-intelligence-mcp.zad.tools,127.0.0.1,127.0.0.1:8088,localhost"
      # Browser origins allowed to call the API cross-origin (CORS). Once this list is
      # non-empty, any other Origin is rejected with 403 INVALID_ORIGIN, so keep the
      # app's own origin and the static Maarad canvas (https://maarad.zadstack.com).
      UAEMCP_ALLOWED_ORIGINS: "https://uaemcp.zad.tools,https://uae-intelligence-mcp.zad.tools,https://uae-open-data.zadstack.com,https://maarad.zadstack.com"
      UAEMCP_DATABASE_PATH: "/app/data/uaemcp.sqlite"
      UAEMCP_HEALTH_SCAN_INTERVAL_MINUTES: "60"
      UAEMCP_SNAPSHOT_INTERVAL_MINUTES: "1440"
      UAEMCP_SNAPSHOT_TARGETS: "moiat_industrial_licenses"
      UAEMCP_SNAPSHOT_LIMIT: "1000"
      UAEMCP_SNAPSHOT_RETENTION: "90"
      UAEMCP_POLICY_WATCH_PATH: "/app/data/policy-watch.json"
      UAEMCP_POLICY_WATCH_INTERVAL_MINUTES: "1440"
      UAEMCP_POLICY_WATCH_RETENTION: "90"
      # Uncomment to enable the write tools (disabled by default):
      # UAEMCP_WRITE_TOKEN: "change-me"
    volumes:
      - uaemcp-data:/app/data

volumes:
  uaemcp-data:
